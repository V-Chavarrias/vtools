[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "download-topotijdreis"
version = "0.1.0"
description = "Download square satellite-image crops from Topotijdreis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10",
    "playwright>=1.50",
]
authors = [
    { name = "Victor Chavarrias" },
]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.scripts]
download-topotijdreis = "download_topotijdreis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
