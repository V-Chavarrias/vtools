[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "change-cover"
version = "0.1.0"
description = "Update titles, authors, and cover images in PowerPoint files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-pptx>=1.0",
]
authors = [
    { name = "Victor Chavarrias" },
]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.scripts]
change-cover = "change_cover.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
