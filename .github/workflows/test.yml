name: Test packages

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - change_cover
          - download_topotijdreis
          - era5_downloader

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./packages/${{ matrix.package }}[test]"
          python -m pip install build

      - name: Run tests
        run: python -m pytest "./packages/${{ matrix.package }}/tests"

      - name: Build distribution
        run: python -m build "./packages/${{ matrix.package }}"
