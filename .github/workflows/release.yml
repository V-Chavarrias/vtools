name: Release package on GitHub

on:
  push:
    tags:
      - "change-cover-v*"
      - "download-topotijdreis-v*"
      - "era5-downloader-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select package from tag
        id: package
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            change-cover-v*)
              echo "directory=packages/change_cover" >> "$GITHUB_OUTPUT"
              ;;
            download-topotijdreis-v*)
              echo "directory=packages/download_topotijdreis" >> "$GITHUB_OUTPUT"
              ;;
            era5-downloader-v*)
              echo "directory=packages/era5_downloader" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build "${{ steps.package.outputs.directory }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "${{ steps.package.outputs.directory }}/dist/"*
